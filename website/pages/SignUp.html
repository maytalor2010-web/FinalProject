<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="auth.css" />
    <title>Sign Up — Fishing Game</title>
  </head>
  <body>
    <div class="bubble-bg" id="bubbleBg"></div>
    <div class="page-center">
      <div class="auth-card panel">
        <div class="auth-header">
          <span class="auth-icon">🎣</span>
          <h1>Join the Game</h1>
          <p>Create your account to start fishing</p>
        </div>
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" type="text" placeholder="e.g. fishmaster99" autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Choose a password" />
        </div>
        <div class="form-group">
          <label for="confirm">Confirm Password</label>
          <input id="confirm" type="password" placeholder="Repeat your password" />
        </div>
        <div id="errorDiv" class="error-msg"></div>
        <button id="signup" class="btn btn-primary full-width">Create Account</button>
        <p class="auth-switch">Already have an account? <a href="LogIn.html">Log in</a></p>
      </div>
    </div>
    <script type="module" src="SignUp.js"></script>
    <script>
      const bg = document.getElementById('bubbleBg');
      for (let i = 0; i < 18; i++) {
        const b = document.createElement('div');
        b.className = 'bubble';
        const size = 16 + Math.random() * 40;
        b.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;animation-duration:${6+Math.random()*10}s;animation-delay:${Math.random()*8}s;`;
        bg.appendChild(b);
      }
    </script>
  </body>
</html>
