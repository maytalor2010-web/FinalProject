<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="index.css" />
    <title>Fishing Game</title>
  </head>
  <body>
    <div class="bubble-bg" id="bubbleBg"></div>
    <div class="page-center">
      <div class="hero">
        <div class="fish-icon">🐟</div>
        <h1 class="title">Fishing Game</h1>
        <p class="subtitle">Click fast. Catch more. Beat the board.</p>
      </div>
      <div class="auth-links panel">
        <a href="SignUp.html" class="btn btn-primary">Sign Up</a>
        <a href="LogIn.html" class="btn btn-ghost">Log In</a>
      </div>
    </div>
    <script type="module" src="index.js"></script>
    <script>
      const bg = document.getElementById('bubbleBg');
      for (let i = 0; i < 18; i++) {
        const b = document.createElement('div');
        b.className = 'bubble';
        const size = 16 + Math.random() * 40;
        b.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;animation-duration:${6+Math.random()*10}s;animation-delay:${Math.random()*8}s;`;
        bg.appendChild(b);
      }
    </script>
  </body>
</html>
