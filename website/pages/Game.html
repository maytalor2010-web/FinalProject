<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="Game.css" />
        <title>Fishit!</title>
    </head>
    <body>
        <div id="generalDiv">
            <div id="sideInfoDiv">
                <div id="userInfoDiv">
                    <div id="userInfoTopDiv">
                        <span id="usernameSpan">🎣 Loading...</span>
                        <button id="logOutButton">Log Out</button>
                    </div> 
                    <div id="userInfoStatsDiv">
                        <span id="LDBPlacementSpan" class="userStats">Leaderboard Placement: loading...</span>
                        <span id="totalGamesSpan" class="userStats">Total Games: loading...</span>
                        <span id="highScoreDiv" class="userStats">High Score: loading...</span>
                    </div>
                </div>
                <div id="fishInfoDiv">
                    <div class="fishContainer">
                        <img src="../image/normal-fish-face-right.png" alt="Normal Fish" class="fishInContainer">
                        <div class="fishDesc">Gives +5 points on click, removes a heart if missed. </div>
                    </div>
                    <div class="fishContainer">
                        <img src="../image/gold-fish-face-right.png" alt="Gold Fish" class="fishInContainer">
                        <div class="fishDesc">Gives +10 points on click, extra fast. </div>
                    </div>
                    <div class="fishContainer">
                        <img src="../image/pufferfish-face-right.png" alt="Pufferfish" class="fishInContainer">
                        <div class="fishDesc">-1 Hearts on click. </div>
                    </div>
                </div>
                <div id="genLeaderboardDiv">
                    <div id="LDBTitle">🏆 Leaderboard</div>
                    <div id="leaderboardDiv"></div>
                </div>
            </div>
            <div id="gameDiv">
                <div id="gameScoreDiv">
                    <p id="heartAmountP">❤️ Hearts: 3</p>
                    <p id="scoreP">⭐ Score: 0</p>
                </div>
                <div id="fishSpawnDiv"></div>
                <span id="gameOverSpan" style="display: none;">Game Over!</span>
                <button id="startButton">Start Game</button>
            </div>
        </div>
        <script type="module" src="Game.js"></script>
    </body>
</html>
